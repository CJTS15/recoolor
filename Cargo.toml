[workspace]
resolver = "3"
members = ["crates/recoolor-core", "crates/recoolor"]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.dependencies]
recoolor-core = { path = "crates/recoolor-core" }

[profile.release]
lto = "thin"
strip = true

# The wallpaper tint runs over every pixel: unoptimized it is about 25 times slower,
# which makes test builds wait seconds for each image.
[profile.dev.package.recoolor-core]
opt-level = 3
