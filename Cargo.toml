[workspace]
resolver = "3"
members = ["crates/recoolor-core", "crates/recoolor"]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.dependencies]
recoolor-core = { path = "crates/recoolor-core" }

[profile.release]
lto = "thin"
strip = true
