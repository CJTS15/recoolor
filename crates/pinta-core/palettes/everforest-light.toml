id = "everforest-light"
name = "Everforest Light"
family = "Everforest"
variant = "light"

# Everforest has no pink, so Pinta mixes one. The accent is blue: text on the green reads below 3:1.

[colors]
base = "#fdf6e3"
mantle = "#f4f0d9"
crust = "#efebd4"
surface = "#e6e2cc"
overlay = "#a6b0a0"
text = "#5c6a72"
subtext = "#829181"
accent = "#3a94c5"
red = "#f85552"
orange = "#f57d26"
yellow = "#dfa000"
green = "#8da101"
blue = "#3a94c5"
teal = "#35a77c"
